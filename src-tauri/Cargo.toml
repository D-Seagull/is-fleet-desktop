[package]
name = "is-fleet-desktop"
# Not the app version — that lives in package.json (tauri.conf.json points
# there). Kept in step only for tidiness; it changes nothing if it lags.
version = "0.2.4"
description = "IS Fleet desktop shell"
edition = "2021"

[lib]
name = "is_fleet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Toasts with a click handler (the notification plugin ignores clicks there).
tauri-winrt-notification = "0.7"
