# Builds + signs the Windows installer and publishes a GitHub Release with
# latest.json, which installed apps poll for updates. Two ways to start it:
#   - Actions → Release → Run workflow (on main): tag is taken from
#     "version" in tauri.conf.json and created automatically
#   - push a tag like v0.2.0 by hand
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Manual run with a version that was already released = forgot the bump.
      - name: Check version was bumped
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is already released. Bump \"version\" in src-tauri/tauri.conf.json first."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # __VERSION__ is replaced with "version" from tauri.conf.json, so the
          # tag always matches what the updater compares against.
          tagName: v__VERSION__
          releaseName: 'IS Fleet v__VERSION__'
          releaseBody: 'Download the installer below. Installed apps update automatically.'
          # Must not be a draft: the updater reads releases/latest, which skips drafts.
          releaseDraft: false
          prerelease: false
